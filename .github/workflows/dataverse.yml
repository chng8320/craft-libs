# The Dataverse fork: follow ArtCraft's main, replay our commits, build our command lines.
# See DATAVERSE.md.
name: dataverse

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dataverse
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'chng8320/craft-libs'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.replay.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dataverse
          fetch-depth: 0
      - name: Update main from ArtCraft
        run: |
          git config user.name "dataverse-sync"
          git config user.email "dataverse-sync@users.noreply.github.com"
          git remote add upstream https://github.com/storytold/craft-libs.git
          git fetch upstream main
          git push origin "refs/remotes/upstream/main:refs/heads/main" --force
      - name: Replay our commits on top
        id: replay
        run: |
          base=$(git merge-base origin/main HEAD)
          if [ "$(git rev-parse upstream/main)" = "$base" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git rebase --onto upstream/main "$base"; then
            git push origin HEAD:dataverse --force-with-lease
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            failed=$(git log -1 --format='%h %s' REBASE_HEAD 2>/dev/null || echo "one of our commits")
            git rebase --abort
            gh issue create --title "Dataverse sync: a commit no longer applies on craft-libs $(git rev-parse --short upstream/main)" \
              --body "Replaying our commits on ArtCraft's latest main stopped at: ${failed}. The dataverse branch was left as it was. Fix that commit on top of the new main, then run this workflow again."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dataverse
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the AI command line (craft-ai with local models and speech to text)
        run: cargo build --release -p craft-ai --features local,speech --example craft-ai-cli
      - name: Test craft-ai
        run: cargo test --release -p craft-ai --features local,speech && cargo test --release -p craft-live
      - name: Name it for the Dataverse
        run: |
          mkdir -p out
          cp target/release/examples/craft-ai-cli out/dataverse-ai-cli
          git rev-parse HEAD > out/VERSION.txt
          cp LICENSE-MIT LICENSE-APACHE NOTICE DATAVERSE.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: dataverse-ai-cli-linux-x86_64
          path: out/

  # The same command line with NVIDIA GPU support. The runner has no GPU: this builds it, and the
  # GPU worker image runs it. CUDA_COMPUTE_CAP picks the oldest GPU generation the kernels target
  # (7.5, Turing: T4 and newer); newer GPUs run them too.
  build-ai-cuda:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    env:
      CUDA_COMPUTE_CAP: "75"
    steps:
      - name: Tools
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates build-essential pkg-config
      - uses: actions/checkout@v4
        with:
          ref: dataverse
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the AI command line with CUDA
        run: cargo build --release -p craft-ai --features local,speech,cuda --example craft-ai-cli
      - name: Name it for the Dataverse
        run: |
          mkdir -p out
          cp target/release/examples/craft-ai-cli out/dataverse-ai-cli
          git config --global --add safe.directory "$PWD"
          git rev-parse HEAD > out/VERSION.txt
          cp LICENSE-MIT LICENSE-APACHE NOTICE DATAVERSE.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: dataverse-ai-cli-linux-x86_64-cuda
          path: out/
